### web
server.port=8060
server.servlet.context-path=/xxl-job-admin
spring.application.name=xxl-job-admin

### actuator
management.server.base-path=/actuator
management.health.mail.enabled=false

### resources
spring.mvc.servlet.load-on-startup=0
spring.mvc.static-path-pattern=/static/**
spring.web.resources.static-locations=classpath:/static/

### freemarker
spring.freemarker.templateLoaderPath=classpath:/templates/
spring.freemarker.suffix=.ftl
spring.freemarker.charset=UTF-8
spring.freemarker.request-context-attribute=request
spring.freemarker.settings.number_format=0.##########
spring.freemarker.settings.new_builtin_class_resolver=safer

### mybatis
mybatis.mapper-locations=classpath:/mybatis-mapper/*Mapper.xml

### datasource-pool
# druid
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.druid.db-type=mysql
# 初始化连接数，设置太大可能导致启动慢、数据库压力增大
spring.datasource.druid.initial-size=5
# 最小空闲连接数
spring.datasource.druid.min-idle=5
# 最大活跃连接数
spring.datasource.druid.max-active=50
# 获取连接的最大等待时间，单位：毫秒
spring.datasource.druid.max-wait=30000
# 空闲连接检测线程的执行间隔，单位：毫秒
spring.datasource.druid.time-between-eviction-runs-millis=60000
# 连接在池中最小和最大空闲时间，单位：毫秒
spring.datasource.druid.min-evictable-idle-time-millis=300000
spring.datasource.druid.max-evictable-idle-time-millis=600000
# 限制物理连接最大存活时间，30分钟
spring.datasource.druid.phy-timeout-millis=1800000
# 检测连接是否有效的 SQL
# MySQL、PostgreSQL 一般可用 SELECT 1，Oracle 建议使用 SELECT 1 FROM DUAL
spring.datasource.druid.validation-query=SELECT 1
# 是否缓存 PreparedStatement
spring.datasource.druid.pool-prepared-statements=true
# 每个连接最多缓存多少个 PreparedStatement
spring.datasource.druid.max-pool-prepared-statement-per-connection-size=20
# 空闲时检测连接是否有效
spring.datasource.druid.test-while-idle=true
# 从连接池获取连接时是否立即检测连接有效性
spring.datasource.druid.test-on-borrow=false
# 归还连接时是否检测连接有效性
spring.datasource.druid.test-on-return=false
# 是否开启连接泄漏回收
spring.datasource.druid.remove-abandoned=false
# 保持连接活跃，减少被数据库服务端主动断开
spring.datasource.druid.keep-alive=true
# 连接占用超过多少秒后被认为可能泄漏，仅 remove-abandoned=true 时生效
# spring.datasource.druid.remove-abandoned-timeout=180
# 打印连接泄漏日志
spring.datasource.druid.log-abandoned=false
# Druid 过滤器
spring.datasource.druid.filters=stat,slf4j
# Druid 连接属性
spring.datasource.druid.connection-properties=druid.stat.mergeSql=true;druid.stat.slowSqlMillis=1000
# Druid 监控页面配置
spring.datasource.druid.stat-view-servlet.enabled=true
spring.datasource.druid.stat-view-servlet.url-pattern=/druid/*
spring.datasource.druid.stat-view-servlet.login-username=admin
spring.datasource.druid.stat-view-servlet.login-password=@yjc+0827#520
# 允许访问监控页面的 IP 白名单
spring.datasource.druid.stat-view-servlet.allow=0.0.0.0/0

### xxl-job, datasource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

### xxl-job, email
spring.mail.host=
spring.mail.port=
spring.mail.username=
spring.mail.from=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory

### xxl-job, access token
xxl.job.accessToken=${ACCESS_TOKEN}
### xxl-job, i18n (default is zh_CN, and you can choose "zh_CN", "zh_TC" and "en")
xxl.job.i18n=zh_CN
## xxl-job, triggerpool max size
xxl.job.triggerpool.fast.max=200
xxl.job.triggerpool.slow.max=100
### xxl-job, log retention days
xxl.job.logretentiondays=30
